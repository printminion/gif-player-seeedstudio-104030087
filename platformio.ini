; ============================================================
; gif-player-seeedstudio-104030087 — PlatformIO configuration
; AUTO-GENERATED from project.json — do not edit by hand.
; Re-generate with: python scripts/generate_platformio.py
; ============================================================

[platformio]
default_envs =
    seeed_xiao_esp32s3
    seeed_xiao_esp32s3-wifi

; ------------------------------------------------------------
; Shared settings inherited by all environments
; ------------------------------------------------------------
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    ayushsharma82/ElegantOTA @ ^3.1.0
    bblanchon/ArduinoJson @ ^7.3.1
    ; --- project lib_deps (from project.json) ---
    https://github.com/Seeed-Projects/SeeedStudio_TFT_eSPI
    https://github.com/Seeed-Projects/SeeedStudio_lvgl
    bitbank2/AnimatedGIF @ ^2.1.1

build_flags =
    -D FIRMWARE_VERSION='"dev"'
    -D PROJECT_NAME='"gif-player-seeedstudio-104030087"'
    -D ARDUINO_LOOP_STACK_SIZE=8192

; ────────────────────────────────────────────────────────────
; Seeed XIAO ESP32-S3  —  release
; ────────────────────────────────────────────────────────────
[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3
board_build.partitions = partitions_esp32s3_8mb.csv
build_flags =
    ${env.build_flags}
    -D BOARD_SEEED_XIAO_ESP32S3
    -D BOARD_NAME='"Seeed XIAO ESP32-S3"'
    -D VARIANT_NO_WIFI
    -D NDEBUG
    -I boards/seeed_xiao_esp32s3

; ────────────────────────────────────────────────────────────
; Seeed XIAO ESP32-S3  —  debug
; ────────────────────────────────────────────────────────────
[env:seeed_xiao_esp32s3-debug]
board = seeed_xiao_esp32s3
board_build.partitions = partitions_esp32s3_8mb.csv
build_flags =
    ${env.build_flags}
    -D BOARD_SEEED_XIAO_ESP32S3
    -D BOARD_NAME='"Seeed XIAO ESP32-S3 (debug)"'
    -D VARIANT_NO_WIFI
    -D DEBUG_BUILD
    -D CORE_DEBUG_LEVEL=4
    -I boards/seeed_xiao_esp32s3
build_type = debug

; ────────────────────────────────────────────────────────────
; Seeed XIAO ESP32-S3  —  release  —  WiFi
; ────────────────────────────────────────────────────────────
[env:seeed_xiao_esp32s3-wifi]
board = seeed_xiao_esp32s3
board_build.partitions = partitions_esp32s3_8mb.csv
build_flags =
    ${env.build_flags}
    -D BOARD_SEEED_XIAO_ESP32S3
    -D BOARD_NAME='"Seeed XIAO ESP32-S3 (WiFi)"'
    -D NDEBUG
    ; wifi.cpp requires WIFI_AP_PASSWORD or WIFI_AP_OPEN=1 for release builds.
    ; Add one of the following to build_flags:
    ;   -D WIFI_AP_PASSWORD='"yourpassword"'  ; password-protected (recommended)
    ;   -D WIFI_AP_OPEN=1                      ; open AP — not for production
    ; Auto-OTA opt-in: uncomment the line below to enable version checking.
    ;   -D VERSION_CHECK_URL='"https://printminion.github.io/gif-player-seeedstudio-104030087/version/seeed_xiao_esp32s3.json"'
    -I boards/seeed_xiao_esp32s3

; ────────────────────────────────────────────────────────────
; Seeed XIAO ESP32-S3  —  debug  —  WiFi
; ────────────────────────────────────────────────────────────
[env:seeed_xiao_esp32s3-wifi-debug]
board = seeed_xiao_esp32s3
board_build.partitions = partitions_esp32s3_8mb.csv
build_flags =
    ${env.build_flags}
    -D BOARD_SEEED_XIAO_ESP32S3
    -D BOARD_NAME='"Seeed XIAO ESP32-S3 (WiFi) (debug)"'
    -D DEBUG_BUILD
    -D CORE_DEBUG_LEVEL=4
    -I boards/seeed_xiao_esp32s3
build_type = debug
